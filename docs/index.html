<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Poll Board</title>
<style>
:root{--navy:#13305a;--gold:#deb160;--bg:#f6f7fb;--ink:#1b2433;--muted:#667;--track:#e8ecf3}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;background:var(--navy);color:#fff;border-bottom:6px solid var(--gold)}
header .t{font-size:24px;font-weight:700}
header .n{font-size:20px;color:var(--gold);white-space:nowrap}
header .adm{color:#c9d4e3;font-size:14px;text-decoration:none;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 10px;white-space:nowrap}
header .adm:hover{color:#fff;border-color:var(--gold)}
#nav{display:flex;gap:6px;align-items:center}
#nav button{font:inherit;font-size:18px;min-width:40px;height:36px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer}
#nav button.on{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
#nav button:hover{border-color:var(--gold)}
main{display:flex;gap:20px;padding:20px 24px;height:calc(100vh - 74px)}
#stage{flex:1;min-width:0;background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:20px 26px;display:flex;flex-direction:column}
#q{font-size:clamp(22px,2.6vw,36px);font-weight:700;color:var(--navy);margin:0 0 6px;line-height:1.2}
#sub{font-size:15px;color:var(--muted);margin-bottom:10px}
#viz{flex:1;position:relative;overflow:auto}
.bar{display:flex;align-items:center;margin:14px 0;font-size:clamp(16px,1.6vw,22px)}
.bar .lab{width:32%;padding-right:12px}
.bar .trk{flex:1;background:var(--track);border-radius:8px;height:42px;overflow:hidden}
.bar .fill{height:100%;background:var(--navy);border-radius:8px;transition:width .5s}
.bar .pct{width:120px;text-align:right;font-weight:700}
.avg{font-size:clamp(18px,1.8vw,26px);color:var(--navy);margin:6px 0 4px;font-weight:700}
.ends{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);margin:2px 0 8px}
.grow{display:flex;align-items:center;margin:12px 0;font-size:clamp(15px,1.5vw,20px)}
.grow .lab{width:28%;padding-right:12px}
.grow .stk{flex:1;display:flex;height:40px;border-radius:8px;overflow:hidden;background:var(--track)}
.grow .seg{height:100%;color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;transition:width .5s;white-space:nowrap;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;margin:6px 0 4px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.theme{margin:0 0 14px;padding:10px 14px 12px;border-left:5px solid var(--gold);background:#f8f9fc;border-radius:8px}
.theme .head{display:flex;align-items:center;gap:12px;font-size:clamp(16px,1.6vw,22px);font-weight:700;color:var(--navy)}
.theme .trk{flex:1;background:var(--track);border-radius:8px;height:30px;overflow:hidden}
.theme .fill{height:100%;background:var(--gold);transition:width .5s}
.theme .cnt{width:60px;text-align:right}
.theme .sum{font-size:15px;color:#334;margin:4px 0 2px}
.theme .ex{font-size:15px;color:var(--muted)}
.theme .ex b{font-style:normal;color:#556;font-weight:600}
.theme .ex i{color:#334}
#cloud{width:100%;height:100%;display:block}
aside{width:280px;background:#fff;border-radius:14px;padding:16px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
aside .h{font-weight:700;color:var(--navy);font-size:20px;margin-bottom:8px}
#qr{display:flex;justify-content:center}
#qr img,#qr canvas{width:100%!important;height:auto!important}
.nav{font-size:13px;color:#889;margin-top:10px;line-height:1.5}
.hide{display:none!important}
#msg{color:#b23a48;font-size:14px;margin-top:8px}
#home{max-width:640px;margin:60px auto;padding:0 20px;text-align:center}
#home h2{color:var(--navy);font-size:30px;margin:0 0 10px}
#home p{color:var(--muted);font-size:17px;line-height:1.5}
#home .btns{display:flex;flex-direction:column;gap:12px;margin:28px auto 0;max-width:360px}
#home a.btn{display:block;padding:14px 18px;border-radius:10px;font-size:18px;font-weight:700;text-decoration:none;border:2px solid var(--navy);color:var(--navy);background:#fff}
#home a.btn.primary{background:var(--navy);color:#fff;border-color:var(--gold)}
#home a.btn:hover{border-color:var(--gold)}
#home small{display:block;margin-top:6px;font-weight:400;font-size:14px;opacity:.85}
@media (max-width:800px){main{flex-direction:column;height:auto}aside{width:100%}.bar .lab{width:40%}.bar .pct{width:80px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
</head>
<body>
<header><div class="t" id="title">Live Poll</div><div id="nav"></div><div class="n" id="count"></div><a class="adm" id="adm" href="#" target="_blank" title="Admin page (staff only)">⚙ Admin</a></header>
<main>
  <section id="stage"><div id="q">Loading…</div><div id="sub"></div><div id="viz"></div><div id="msg"></div></section>
  <aside id="qrbox"><div class="h">Answer here</div><div id="qr"></div><div>Sign in with your UCSD account</div>
    <div class="nav">Buttons at the top, ← →, or 1-9: question · Q: QR code<br>T: themes / words</div></aside>
</main>
<script>
const P = new URLSearchParams(location.search);
const KEY = new URLSearchParams(location.hash.slice(1)).get('k') || '';
const COURSE = P.get('course') || 'cse291a';
const WEEK = Number(P.get('week') || 1);
const C = (window.BOARD_CONFIG && window.BOARD_CONFIG.courses[COURSE]) || {};
if (window.BOARD_CONFIG && window.BOARD_CONFIG.admin) document.getElementById('adm').href = window.BOARD_CONFIG.admin;
else document.getElementById('adm').remove();
const API = window.BOARD_CONFIG && window.BOARD_CONFIG.api;
document.getElementById('title').textContent = (C.title || COURSE) + ' · Week ' + WEEK;
document.title = (C.title || 'Live Poll') + ' · Week ' + WEEK;

let D = null, cur = Math.max(0, Number(P.get('q') || 1) - 1), last = '', view = 'themes';
const TH = {};           // formId -> themes result
const QRC = {};          // url -> qr data url
const pal = ['#13305a','#c48f2c','#1f6f8b','#7a3e9d','#2e7d32','#b23a48','#455a64'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function qr(url) {
  const box = document.getElementById('qr');
  if (box.dataset.url === url) return;
  box.dataset.url = url; box.innerHTML = '';
  new QRCode(box, { text: url, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M });
}

function draw(force) {
  if (!D || !D.slides || !D.slides.length) return;
  cur = Math.max(0, Math.min(cur, D.slides.length - 1));
  const s = D.slides[cur], th = TH[s.formId];
  const showThemes = s.kind === 'long' && view === 'themes' && th && th.themes && th.themes.length;
  const key = JSON.stringify([cur, s.items, s.counts, s.avg, showThemes ? th : 0, view]);
  document.getElementById('count').textContent = s.n + ' response' + (s.n === 1 ? '' : 's');
  document.getElementById('q').textContent = s.title;
  document.getElementById('sub').textContent = `Question ${cur + 1} of ${D.slides.length}` +
    (s.kind === 'long' ? (showThemes ? ' · themes by Claude, from ' + th.n + ' answers' : ' · words') : '');
  qr(s.url);
  navBar();
  if (key === last && !force) return;
  last = key;
  const v = document.getElementById('viz'); v.innerHTML = '';
  if (s.kind === 'bars' || s.kind === 'scale') {
    // Checkboxes: % of students who picked the option, not % of all ticks.
    const tot = (s.multi ? s.n : s.items.reduce((a, x) => a + x[1], 0)) || 1;
    if (s.kind === 'scale') {
      v.insertAdjacentHTML('beforeend', `<div class="avg">${s.avg == null ? 'No answers yet' : 'Average ' + s.avg + ' / ' + s.hi}</div>` +
        ((s.loLabel || s.hiLabel) ? `<div class="ends"><span>${s.lo} = ${esc(s.loLabel)}</span><span>${s.hi} = ${esc(s.hiLabel)}</span></div>` : ''));
    }
    for (const [o, k] of s.items) {
      const p = Math.round(100 * k / tot);
      const lab = s.kind === 'scale' ? (s.rating ? '★'.repeat(+o) : o) : o;
      v.insertAdjacentHTML('beforeend', `<div class="bar"><div class="lab">${esc(lab)}</div><div class="trk"><div class="fill" style="width:${p}%"></div></div><div class="pct">${p}% (${k})</div></div>`);
    }
  } else if (s.kind === 'grid') {
    const gp = ['#13305a', '#1f6f8b', '#9fb3c8', '#deb160', '#c48f2c', '#b23a48', '#7a3e9d'];
    v.insertAdjacentHTML('beforeend', '<div class="legend">' + s.cols.map((c, i) => `<span><i style="background:${gp[i % gp.length]}"></i>${esc(c)}</span>`).join('') + '</div>');
    s.rows.forEach((r, ri) => {
      const cs = s.counts[ri], tot = cs.reduce((a, b) => a + b, 0) || 1;
      const segs = cs.map((k, ci) => k ? `<div class="seg" style="width:${100 * k / tot}%;background:${gp[ci % gp.length]}">${Math.round(100 * k / tot)}%</div>` : '').join('');
      v.insertAdjacentHTML('beforeend', `<div class="grow"><div class="lab">${esc(r)}</div><div class="stk">${segs}</div></div>`);
    });
  } else if (showThemes) {
    const max = Math.max(1, ...th.themes.map(t => t.count));
    for (const t of th.themes) {
      v.insertAdjacentHTML('beforeend', `<div class="theme"><div class="head"><span style="min-width:30%">${esc(t.label)}</span><div class="trk"><div class="fill" style="width:${Math.round(100 * t.count / max)}%"></div></div><span class="cnt">${t.count}</span></div><div class="sum">${esc(t.summary)}</div>${t.example ? `<div class="ex"><b>Example answer:</b> <i>“${esc(t.example)}”</i></div>` : ''}</div>`);
    }
  } else {
    const c = document.createElement('canvas'); c.id = 'cloud'; v.appendChild(c);
    c.width = v.clientWidth; c.height = v.clientHeight;
    const max = Math.max(1, ...s.items.map(x => x[1]));
    const sc = Math.min(c.width / 800, c.height / 450);
    const words = s.items.map(([w, k]) => [w, Math.round((18 + 92 * Math.sqrt(k / max)) * sc)]);
    if (words.length) WordCloud(c, { list: words, fontFamily: '-apple-system,Helvetica,Arial', fontWeight: '700',
      color: () => pal[Math.floor(Math.random() * pal.length)], rotateRatio: 0, gridSize: 10, shuffle: false, backgroundColor: '#fff' });
  }
}

function go(i) { cur = i; draw(true); }
function navBar() {
  const nav = document.getElementById('nav'), n = D.slides.length;
  const sig = n + ':' + cur;
  if (nav.dataset.sig === sig) return;
  nav.dataset.sig = sig; nav.innerHTML = '';
  const b = (label, i, on, title) => { const e = document.createElement('button'); e.textContent = label; e.title = title; if (on) e.className = 'on'; e.onclick = () => go(i); nav.appendChild(e); };
  b('‹', Math.max(0, cur - 1), false, 'Previous question');
  for (let i = 0; i < n; i++) b(String(i + 1), i, i === cur, 'Question ' + (i + 1));
  b('›', Math.min(n - 1, cur + 1), false, 'Next question');
}

async function get(params) {
  const u = API + '?' + new URLSearchParams(Object.assign({ key: KEY, course: COURSE }, params));
  const r = await fetch(u, { cache: 'no-store' });
  return r.json();
}

// Overlapping polls: a new request every 500 ms, at most 3 in flight; keep the newest result.
let inflight = 0, lastAt = 0;
async function tick() {
  if (inflight >= 3) return;
  inflight++;
  try {
    const d = await get({ week: WEEK });
    if (d.error) { document.getElementById('msg').textContent = d.error; }
    else if (d.at >= lastAt) {
      if (d.course && d.course.title) document.getElementById('title').textContent = d.course.title + (d.course.term ? ' (' + d.course.term + ')' : '') + ' · Week ' + WEEK;
      lastAt = d.at; D = d; mergePushed(); document.getElementById('msg').textContent = ''; draw(false); }
  } catch (e) { document.getElementById('msg').textContent = 'Connection problem, retrying'; }
  inflight--;
}

// Push: Firebase Realtime Database stream (aggregates only). Newer data wins per slide.
const PUSHED = {};
function mergePushed() {
  if (!D) return;
  D.slides = D.slides.map(s => (PUSHED[s.formId] && PUSHED[s.formId].at > (s.at || 0)) ? Object.assign({}, s, PUSHED[s.formId]) : s);
}
function listen() {
  const fb = window.BOARD_CONFIG && window.BOARD_CONFIG.firebase;
  if (!fb) return false;
  const es = new EventSource(fb.replace(/\/$/, '') + '/boards/' + KEY + '/' + COURSE + '/w' + WEEK + '.json');
  const onData = ev => {
    const m = JSON.parse(ev.data);
    if (m.path === '/') Object.assign(PUSHED, m.data || {});
    else PUSHED[m.path.slice(1).split('/')[0]] = m.data;
    mergePushed(); draw(false);
  };
  es.addEventListener('put', onData);
  es.addEventListener('patch', onData);
  return true;
}

async function themeTick() {
  try {
    if (D && D.slides[cur] && D.slides[cur].kind === 'long' && D.slides[cur].n >= 3) {
      const s = D.slides[cur];
      if (!TH[s.formId] || TH[s.formId].n !== s.n) {
        const t = await get({ action: 'themes', form: s.formId });
        if (!t.error) { TH[s.formId] = t; draw(false); }
      }
    }
  } catch (e) {}
  setTimeout(themeTick, 8000);
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); cur++; draw(true); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); cur--; draw(true); }
  else if (/^[1-9]$/.test(e.key)) { cur = +e.key - 1; draw(true); }
  else if (e.key === 'q' || e.key === 'Q') { document.getElementById('qrbox').classList.toggle('hide'); setTimeout(() => draw(true), 50); }
  else if (e.key === 't' || e.key === 'T') { view = view === 'themes' ? 'words' : 'themes'; draw(true); }
});
window.addEventListener('resize', () => draw(true));
// Demo mode (?demo=1): sample data for each question type, no backend. Used for docs and training.
if (P.get('demo')) {
  D = { at: 1, slides: [
    { formId: 'd1', kind: 'bars', title: "What's your program?", url: 'https://example.com/form', n: 41,
      items: [['Grad: CSE MS', 28], ['Grad: CSE PhD', 1], ['Grad: DSC', 2], ['Grad: other program', 9], ['Undergrad', 1]] },
    { formId: 'd2', kind: 'cloud', title: 'An AI tool you use every day', url: 'https://example.com/form', n: 43,
      items: [['Claude', 12], ['Gemini', 9], ['Codex', 7], ['ChatGPT', 6], ['Claude Code', 4], ['Cursor', 3], ['Copilot', 2], ['Notion', 1], ['Perplexity', 1]] },
    { formId: 'd3', kind: 'scale', title: 'The benefits of tracking employee demographic data outweigh the risks.', url: 'https://example.com/form', n: 38,
      items: [['1', 3], ['2', 7], ['3', 11], ['4', 12], ['5', 5]], avg: 3.2, lo: 1, hi: 5, loLabel: 'Strongly disagree', hiLabel: 'Strongly agree' },
    { formId: 'd4', kind: 'grid', title: 'How helpful would each governance structure be for bias mitigation?', url: 'https://example.com/form', n: 36,
      rows: ['Internal ethics board', 'Independent external audit', 'Government regulation', 'User or community advisory panel', 'Open public scrutiny'],
      cols: ['Not helpful', 'Somewhat helpful', 'Very helpful'], counts: [[8, 20, 8], [2, 12, 22], [6, 16, 14], [4, 14, 18], [10, 18, 8]], items: [] },
    { formId: 'd5', kind: 'long', title: 'How can users be integrated into the bias mitigation process?', url: 'https://example.com/form', n: 34,
      items: [['feedback', 14], ['testing', 9], ['diverse', 8], ['panels', 6], ['reporting', 5], ['audits', 4], ['community', 4]] },
  ] };
  TH.d5 = { n: 34, themes: [
    { label: 'User feedback loops', count: 12, summary: 'Let users flag biased outputs and feed reports back into retraining.', example: 'A simple report button that goes straight to the team that retrains the model.' },
    { label: 'Diverse user testing', count: 9, summary: 'Test with users from the groups most likely to be harmed before launch.', example: 'Recruit testers from communities the model will affect, not just employees.' },
    { label: 'Community advisory panels', count: 7, summary: 'Give affected communities a standing role in design decisions.', example: 'A paid advisory panel that reviews major changes.' },
    { label: 'Transparency to users', count: 6, summary: 'Explain how the system works so users can spot problems.', example: 'Show users why a recommendation was made.' },
  ] };
  document.getElementById('title').textContent = (C.title || 'Live Poll') + ' · Demo';
  draw(true);
} else if (!KEY) {
  // No board link: start page with links to the admin page, the demo and the docs.
  const cfg = window.BOARD_CONFIG || {};
  document.getElementById('title').textContent = 'Google Form Live Poll';
  document.title = 'Google Form Live Poll';
  document.querySelector('main').outerHTML = `<div id="home">
    <h2>Live polls on Google Forms</h2>
    <p>Students answer with their university Google account. The board shows the results live, and participation credit comes out of a Google Sheet.</p>
    <div class="btns">
      <a class="btn primary" href="${cfg.admin || '#'}">Admin page<small>Questions, answers, board links, new courses (sign-in required)</small></a>
      <a class="btn" href="?course=cse291a&demo=1">Demo board<small>Sample data for every question type</small></a>
      <a class="btn" href="https://github.com/WeibelLab/google-form-live-poll#readme">Documentation</a>
    </div>
    <p style="margin-top:28px;font-size:14px">To show a poll in class, use the board link for the week (Board links tab on the admin page).</p>
  </div>`;
} else if (!API) document.getElementById('q').textContent = 'Board is not configured.';
else { tick(); setInterval(tick, listen() ? 3000 : 500); themeTick(); }
</script>
</body>
</html>
